[profile.default]
evm_version = "cancun"                              # See https://www.evmdiff.com/features?name=PUSH0&kind=opcode
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
test = "test"
cache_path = "cache_forge"
optimizer = true
optimizer_runs = 4000
solc_version = "0.8.27"
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "./" }]
threads=0  # Increases tests speed 110.28s => 99.82s
etherscan_api_key = "${ETHERSCAN_API_KEY}"


[profile.ci]
optimizer = true
optimizer_runs = 4000
verbosity = 3

[profile.ci.fuzz]
runs = 1


[profile.forktest]
optimizer = false
optimizer_runs = 5


[fmt]
bracket_spacing = true
int_types = "long"
line_length = 120
multiline_func_header = "all"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true


[rpc_endpoints]
mainnet = "https://eth-mainnet.g.alchemy.com/v2/${API_KEY_ALCHEMY}"
holesky = "https://eth-holesky.g.alchemy.com/v2/${API_KEY_ALCHEMY}"
